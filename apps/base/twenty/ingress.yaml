# Host is patched per environment in apps/<env>/twenty.
# No TLS: Cloudflare terminates at the edge, traefik serves plain HTTP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: twenty
spec:
  ingressClassName: traefik
  rules:
    - host: placeholder.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: twenty-server
                port:
                  number: 3000
