apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: twenty-postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: twenty-postgres
spec:
  selector:
    app: twenty-postgres
  ports:
    - port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twenty-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: twenty-postgres
  template:
    metadata:
      labels:
        app: twenty-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: twenty
            - name: POSTGRES_DB
              value: twenty
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: twenty
                  key: POSTGRES_PASSWORD
            # The volume is mounted at the data dir, so keep the cluster in a
            # subdirectory rather than at the mount root.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "twenty", "-d", "twenty"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: twenty-postgres-data
