apiVersion: v1
kind: Service
metadata:
  name: twenty-server
spec:
  selector:
    app: twenty-server
  ports:
    - port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twenty-server
spec:
  replicas: 1
  # Single ReadWriteOnce volume shared with the worker.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: twenty-server
  template:
    metadata:
      labels:
        app: twenty-server
    spec:
      initContainers:
        # Mirrors compose's `depends_on: db: condition: service_healthy`.
        - name: wait-for-db
          image: postgres:16
          command:
            - sh
            - -c
            - until pg_isready -h twenty-postgres -U twenty -q; do echo "waiting for postgres..."; sleep 2; done
      containers:
        - name: server
          image: twentycrm/twenty:v2.37.0
          # The entrypoint runs database migrations on boot unless
          # DISABLE_DB_MIGRATIONS is set, which is why only the worker sets it.
          envFrom:
            - configMapRef:
                name: twenty-env
          env:
            - name: NODE_PORT
              value: "3000"
            - name: REDIS_URL
              value: redis://twenty-redis:6379
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: twenty
                  key: POSTGRES_PASSWORD
            - name: PG_DATABASE_URL
              value: postgres://twenty:$(POSTGRES_PASSWORD)@twenty-postgres:5432/twenty
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: twenty
                  key: APP_SECRET
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: twenty
                  key: ENCRYPTION_KEY
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          volumeMounts:
            - name: local-storage
              mountPath: /app/packages/twenty-server/.local-storage
      volumes:
        - name: local-storage
          persistentVolumeClaim:
            claimName: twenty-local-storage
