apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - storage.yaml
  - server.yaml
  - worker.yaml
  - ingress.yaml
# Generated (not a plain ConfigMap) so the name hash changes when a value
# changes, which rolls the server and worker instead of leaving them stale.
configMapGenerator:
  - name: twenty-env
    literals:
      - STORAGE_TYPE=local
